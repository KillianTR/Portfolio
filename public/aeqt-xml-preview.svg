<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" fill="url(#bgGrad)"/>

  <!-- Subtle tech grid -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="60" y1="0" x2="60" y2="380"/>
    <line x1="160" y1="0" x2="160" y2="380"/>
    <line x1="260" y1="0" x2="260" y2="380"/>
    <line x1="360" y1="0" x2="360" y2="380"/>
    <line x1="460" y1="0" x2="460" y2="380"/>
    <line x1="560" y1="0" x2="560" y2="380"/>
  </g>

  <!-- Glow blob -->
  <circle cx="480" cy="100" r="90" fill="#38bdf8" opacity="0.12" filter="url(#glow)"/>

  <!-- Window Container -->
  <rect x="40" y="35" width="520" height="310" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" opacity="0.95"/>

  <!-- Window Header -->
  <rect x="40" y="35" width="520" height="42" rx="14" fill="#1e293b" opacity="0.8"/>
  <rect x="40" y="65" width="520" height="12" fill="#1e293b" opacity="0.8"/>
  <line x1="40" y1="77" x2="560" y2="77" stroke="#334155" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="65" cy="56" r="6" fill="#ef4444" opacity="0.85"/>
  <circle cx="85" cy="56" r="6" fill="#f59e0b" opacity="0.85"/>
  <circle cx="105" cy="56" r="6" fill="#10b981" opacity="0.85"/>

  <!-- Window Title -->
  <text x="300" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">AEQT :: Sincronización XML &amp; Empleo</text>

  <!-- Code Preview Area -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" xml:space="preserve">
    <!-- Line numbers -->
    <text x="65" y="112" fill="#475569">01</text>
    <text x="65" y="136" fill="#475569">02</text>
    <text x="65" y="160" fill="#475569">03</text>
    <text x="65" y="184" fill="#475569">04</text>
    <text x="65" y="208" fill="#475569">05</text>
    <text x="65" y="232" fill="#475569">06</text>
    <text x="65" y="256" fill="#475569">07</text>
    <text x="65" y="280" fill="#475569">08</text>

    <!-- Code content -->
    <text x="100" y="112" fill="#e2e8f0">&lt;<tspan fill="#38bdf8">aeqt_job_feed</tspan> <tspan fill="#a78bfa">version</tspan>=<tspan fill="#34d399">"2.0"</tspan>&gt;</text>
    <text x="120" y="136" fill="#e2e8f0">&lt;<tspan fill="#38bdf8">empresa</tspan> <tspan fill="#a78bfa">sector</tspan>=<tspan fill="#34d399">"Químic Tarragona"</tspan>&gt;</text>
    <text x="140" y="160" fill="#e2e8f0">&lt;<tspan fill="#38bdf8">oferta</tspan> <tspan fill="#a78bfa">id</tspan>=<tspan fill="#34d399">"AEQT-2025-084"</tspan>&gt;</text>
    <text x="160" y="184" fill="#e2e8f0">&lt;<tspan fill="#38bdf8">estat_sync</tspan>&gt;<tspan fill="#10b981">Validat &amp; Publicat</tspan>&lt;/<tspan fill="#38bdf8">estat_sync</tspan>&gt;</text>
    <text x="160" y="208" fill="#e2e8f0">&lt;<tspan fill="#38bdf8">filtre_perfil</tspan>&gt;<tspan fill="#f59e0b">Enginyeria / Tècnic</tspan>&lt;/<tspan fill="#38bdf8">filtre_perfil</tspan>&gt;</text>
    <text x="140" y="232" fill="#e2e8f0">&lt;/<tspan fill="#38bdf8">oferta</tspan>&gt;</text>
    <text x="120" y="256" fill="#e2e8f0">&lt;/<tspan fill="#38bdf8">empresa</tspan>&gt;</text>
    <text x="100" y="280" fill="#e2e8f0">&lt;/<tspan fill="#38bdf8">aeqt_job_feed</tspan>&gt;</text>
  </g>

  <!-- Confidential Badge Inside Graphic -->
  <rect x="360" y="296" width="180" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="376" cy="310" r="4" fill="#38bdf8"/>
  <text x="388" y="314" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">AEQT • Plugin a mida PHP</text>
</svg>
