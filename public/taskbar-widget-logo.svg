<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="taskBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1e36" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <!-- Squircle Base -->
  <rect width="100" height="100" rx="22" fill="url(#taskBg)" />
  <rect width="98" height="98" x="1" y="1" rx="21" fill="none" stroke="rgba(56,189,248,0.3)" stroke-width="1.5" />
  <!-- Musical Wave Bars (Taskbar Visualizer) -->
  <rect x="22" y="44" width="7" height="20" rx="3.5" fill="#38bdf8" opacity="0.75" />
  <rect x="34" y="32" width="7" height="42" rx="3.5" fill="#38bdf8" opacity="0.9" />
  <rect x="46" y="24" width="7" height="58" rx="3.5" fill="#ffffff" />
  <rect x="58" y="36" width="7" height="34" rx="3.5" fill="#38bdf8" opacity="0.95" />
  <rect x="70" y="48" width="7" height="12" rx="3.5" fill="#38bdf8" opacity="0.75" />
  <!-- Bottom Windows Taskbar Tray Line -->
  <line x1="20" y1="86" x2="80" y2="86" stroke="rgba(255,255,255,0.25)" stroke-width="2" stroke-linecap="round" />
  <circle cx="50" cy="86" r="2" fill="#38bdf8" />
</svg>
