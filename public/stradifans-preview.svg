<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="50%" stop-color="#10141d" />
      <stop offset="100%" stop-color="#07080b" />
    </linearGradient>
    <linearGradient id="accent-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7a18" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="twitch-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9146ff" />
      <stop offset="100%" stop-color="#772ce8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg-grad)" />

  <!-- Subtle racing grid pattern -->
  <g opacity="0.06">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" />
    </pattern>
    <rect width="1200" height="675" fill="url(#grid)" />
  </g>

  <!-- Carbon / Speed accents -->
  <path d="M-100 675 L300 0 L360 0 L-40 675 Z" fill="#ff7a18" opacity="0.12" />
  <path d="M-40 675 L360 0 L400 0 L0 675 Z" fill="#ff7a18" opacity="0.05" />

  <!-- Main Card Container / UI Frame -->
  <rect x="80" y="60" width="1040" height="555" rx="24" fill="#141824" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Window Header -->
  <rect x="80" y="60" width="1040" height="60" rx="24" fill="#1a2030" />
  <rect x="80" y="96" width="1040" height="24" fill="#1a2030" />
  <circle cx="120" cy="90" r="7" fill="#ef4444" />
  <circle cx="144" cy="90" r="7" fill="#f59e0b" />
  <circle cx="168" cy="90" r="7" fill="#10b981" />
  <text x="600" y="96" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="1">
    stradifans.vercel.app · DEPARTAMENTO DE SIMRACING
  </text>

  <!-- Brand Title & Badges -->
  <g transform="translate(130, 160)">
    <!-- Checker flag mini badge -->
    <rect x="0" y="0" width="130" height="32" rx="16" fill="rgba(234, 111, 24, 0.15)" stroke="#ea6f18" stroke-width="1.5" />
    <text x="65" y="21" fill="#ea6f18" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0.5">🏁 PADDOCK FAN</text>

    <!-- Main Title -->
    <text x="0" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      StradiFans
    </text>
    <text x="235" y="80" fill="#ff7a18" font-family="system-ui, sans-serif" font-size="44" font-weight="800">
      .app
    </text>

    <text x="0" y="118" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="18" font-weight="400">
      Web fan interactiva de simracing: directo de Twitch, ranking de salidas, Stradipedia y soundboard.
    </text>
  </g>

  <!-- Interactive Mockup: Starting Lights (Semáforo de salida) -->
  <g transform="translate(130, 320)">
    <rect x="0" y="0" width="450" height="230" rx="16" fill="#0c0e14" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />
    <text x="24" y="36" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="16" font-weight="700">
      🚦 Ranking de Salidas (Reaction Test)
    </text>
    <text x="24" y="58" fill="#64748b" font-family="system-ui, sans-serif" font-size="13">
      Mide tus reflejos con el semáforo oficial de carreras
    </text>

    <!-- 5 Lights Bar -->
    <g transform="translate(24, 85)">
      <!-- Light 1 -->
      <rect x="0" y="0" width="70" height="80" rx="8" fill="#181c26" stroke="#334155" />
      <circle cx="35" cy="40" r="22" fill="#ef4444" filter="url(#glow)" opacity="0.95" />
      <!-- Light 2 -->
      <rect x="80" y="0" width="70" height="80" rx="8" fill="#181c26" stroke="#334155" />
      <circle cx="115" cy="40" r="22" fill="#ef4444" filter="url(#glow)" opacity="0.95" />
      <!-- Light 3 -->
      <rect x="160" y="0" width="70" height="80" rx="8" fill="#181c26" stroke="#334155" />
      <circle cx="195" cy="40" r="22" fill="#ef4444" filter="url(#glow)" opacity="0.95" />
      <!-- Light 4 -->
      <rect x="240" y="0" width="70" height="80" rx="8" fill="#181c26" stroke="#334155" />
      <circle cx="275" cy="40" r="22" fill="#ef4444" filter="url(#glow)" opacity="0.95" />
      <!-- Light 5 -->
      <rect x="320" y="0" width="70" height="80" rx="8" fill="#181c26" stroke="#334155" />
      <circle cx="355" cy="40" r="22" fill="#ef4444" filter="url(#glow)" opacity="0.95" />
    </g>

    <!-- Best Score Chip -->
    <rect x="24" y="180" width="180" height="30" rx="6" fill="#1e293b" />
    <text x="114" y="200" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
      ⚡ Tu tiempo: 0.198s (P1)
    </text>
  </g>

  <!-- Interactive Mockup: Sections Grid (Stradipedia, Garaje, Radio) -->
  <g transform="translate(610, 320)">
    <!-- Box 1: Stradipedia -->
    <rect x="0" y="0" width="460" height="68" rx="14" fill="#0c0e14" stroke="rgba(234, 111, 24, 0.4)" stroke-width="1.5" />
    <circle cx="36" cy="34" r="18" fill="rgba(234, 111, 24, 0.2)" />
    <text x="36" y="40" fill="#ea6f18" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">📖</text>
    <text x="70" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Stradipedia</text>
    <text x="70" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Glosario de lore, coñas y personajes del chat</text>
    <text x="430" y="38" fill="#ea6f18" font-family="system-ui, sans-serif" font-size="18" text-anchor="end">→</text>

    <!-- Box 2: Radio & Soundboard -->
    <rect x="0" y="80" width="460" height="68" rx="14" fill="#0c0e14" stroke="rgba(192, 76, 240, 0.4)" stroke-width="1.5" />
    <circle cx="36" cy="114" r="18" fill="rgba(192, 76, 240, 0.2)" />
    <text x="36" y="120" fill="#c04cf0" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">📻</text>
    <text x="70" y="110" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Radio &amp; Soundboard</text>
    <text x="70" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Frases míticas de carreras para reproducir y descargar</text>
    <text x="430" y="118" fill="#c04cf0" font-family="system-ui, sans-serif" font-size="18" text-anchor="end">→</text>

    <!-- Box 3: Garaje & Telemetría -->
    <rect x="0" y="160" width="460" height="68" rx="14" fill="#0c0e14" stroke="rgba(0, 155, 254, 0.4)" stroke-width="1.5" />
    <circle cx="36" cy="194" r="18" fill="rgba(0, 155, 254, 0.2)" />
    <text x="36" y="200" fill="#009bfe" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">🏎️</text>
    <text x="70" y="190" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Garaje &amp; Medidor</text>
    <text x="70" y="210" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Ruleta de clips, incidentes y telemetría en directo</text>
    <text x="430" y="198" fill="#009bfe" font-family="system-ui, sans-serif" font-size="18" text-anchor="end">→</text>
  </g>

  <!-- Live Status Pill (Top Right) -->
  <g transform="translate(870, 175)">
    <rect x="0" y="0" width="200" height="38" rx="19" fill="rgba(145, 70, 255, 0.15)" stroke="#9146ff" stroke-width="1.5" />
    <circle cx="22" cy="19" r="6" fill="#10b981" filter="url(#glow)" />
    <text x="38" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">TWITCH LIVE SYNC</text>
  </g>
</svg>
