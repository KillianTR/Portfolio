<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="dtmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1418" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="needleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff424d" />
      <stop offset="100%" stop-color="#f87171" />
    </linearGradient>
  </defs>
  <!-- Squircle Base -->
  <rect width="100" height="100" rx="22" fill="url(#dtmBg)" />
  <rect width="98" height="98" x="1" y="1" rx="21" fill="none" stroke="rgba(255,66,77,0.3)" stroke-width="1.5" />
  <!-- Gauge Arc Background -->
  <path d="M 22 72 A 38 38 0 1 1 78 72" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6" stroke-linecap="round" />
  <!-- Active Telemetry Arc -->
  <path d="M 22 72 A 38 38 0 0 1 68 24" fill="none" stroke="url(#needleGrad)" stroke-width="6" stroke-linecap="round" />
  <!-- RPM Ticks -->
  <line x1="28" y1="62" x2="33" y2="59" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="38" y1="36" x2="42" y2="41" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="50" y1="20" x2="50" y2="26" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <line x1="62" y1="36" x2="58" y2="41" stroke="#ff424d" stroke-width="2" stroke-linecap="round"/>
  <!-- Center Pivot and Needle -->
  <line x1="50" y1="52" x2="66" y2="30" stroke="#ff424d" stroke-width="4" stroke-linecap="round" />
  <circle cx="50" cy="52" r="6" fill="#ffffff" />
  <circle cx="50" cy="52" r="3" fill="#ff424d" />
  <!-- HUD Text -->
  <text x="50" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#ffffff" letter-spacing="1.5" text-anchor="middle">DTM PRO</text>
</svg>
