<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="pomoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062e24" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="emeraldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <!-- Squircle Base -->
  <rect width="100" height="100" rx="22" fill="url(#pomoBg)" />
  <rect width="98" height="98" x="1" y="1" rx="21" fill="none" stroke="rgba(52,211,153,0.3)" stroke-width="1.5" />
  <!-- Timer Top Clicker Buttons -->
  <rect x="44" y="12" width="12" height="6" rx="2" fill="#34d399" />
  <line x1="68" y1="20" x2="74" y2="25" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
  <!-- Clock Outer Dial -->
  <circle cx="50" cy="54" r="30" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="5" />
  <!-- Active 25-min Progress Sector -->
  <path d="M 50 24 A 30 30 0 1 1 24 64 L 50 54 Z" fill="rgba(16,185,129,0.22)" stroke="url(#emeraldRing)" stroke-width="4" stroke-linejoin="round" />
  <!-- Center Dot & Hand -->
  <circle cx="50" cy="54" r="4.5" fill="#ffffff" />
  <line x1="50" y1="54" x2="50" y2="34" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <line x1="50" y1="54" x2="68" y2="54" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
</svg>
