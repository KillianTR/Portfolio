<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="calafatBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="100%" stop-color="#2a1608" />
    </linearGradient>
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="trackGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ea580c" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Squircle Base -->
  <rect width="100" height="100" rx="22" fill="url(#calafatBg)" />
  <rect width="98" height="98" x="1" y="1" rx="21" fill="none" stroke="rgba(249,115,22,0.3)" stroke-width="1.5" />

  <!-- Track Asphalt Underlay -->
  <path d="M 28 65 C 20 65 18 45 28 35 C 38 25 55 24 68 28 C 78 31 82 42 76 52 C 72 58 60 52 54 48 C 46 42 38 48 42 56 C 45 62 40 65 28 65 Z"
        fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Track Outer Border / Curb -->
  <path d="M 28 65 C 20 65 18 45 28 35 C 38 25 55 24 68 28 C 78 31 82 42 76 52 C 72 58 60 52 54 48 C 46 42 38 48 42 56 C 45 62 40 65 28 65 Z"
        fill="none" stroke="url(#trackGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#trackGlow)" />

  <!-- Start / Finish Line -->
  <line x1="28" y1="60" x2="28" y2="70" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <circle cx="28" cy="65" r="2.5" fill="#22c55e" />

  <!-- Apex marker -->
  <circle cx="75" cy="38" r="3" fill="#facc15" />

  <!-- Subtitle Text -->
  <text x="50" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" fill="#f97316" letter-spacing="1.5" text-anchor="middle">CALAFAT 3D</text>
</svg>
