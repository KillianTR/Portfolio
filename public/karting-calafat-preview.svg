<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg-grad-calafat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#141a29" />
      <stop offset="100%" stop-color="#0a0c12" />
    </linearGradient>
    <linearGradient id="orange-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="trackGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg-grad-calafat)" />

  <!-- Speed Grid Pattern -->
  <g opacity="0.05">
    <pattern id="grid-c" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" />
    </pattern>
    <rect width="1200" height="675" fill="url(#grid-c)" />
  </g>

  <!-- Speed Stripes -->
  <path d="M-80 675 L280 0 L340 0 L-20 675 Z" fill="#f97316" opacity="0.08" />
  <path d="M-20 675 L340 0 L380 0 L20 675 Z" fill="#f97316" opacity="0.04" />

  <!-- Window Frame -->
  <rect x="80" y="60" width="1040" height="555" rx="24" fill="#111827" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Window Header -->
  <rect x="80" y="60" width="1040" height="60" rx="24" fill="#182234" />
  <rect x="80" y="96" width="1040" height="24" fill="#182234" />
  <circle cx="120" cy="90" r="7" fill="#ef4444" />
  <circle cx="144" cy="90" r="7" fill="#f59e0b" />
  <circle cx="168" cy="90" r="7" fill="#10b981" />
  <text x="600" y="96" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1">
    overtake.gg/downloads/karting-calafat.88434 · KARTING CALAFAT 3D CIRCUIT
  </text>

  <!-- Left Info Column -->
  <g transform="translate(140, 160)">
    <!-- Badges -->
    <rect x="0" y="0" width="130" height="28" rx="14" fill="#ea580c" opacity="0.2" />
    <text x="65" y="19" fill="#f97316" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">OVERTAKE.GG</text>

    <rect x="140" y="0" width="150" height="28" rx="14" fill="rgba(255,255,255,0.08)" />
    <text x="215" y="19" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">ASSETTO CORSA</text>

    <!-- Main Title -->
    <text x="0" y="75" fill="#ffffff" font-family="system-ui, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
      Karting Calafat
    </text>
    <text x="0" y="112" fill="#f97316" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
      Primer circuito 3D creado en 3 semanas con Blender
    </text>

    <text x="0" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16" font-weight="400">
      Modelado integral en 3D, texturas personalizadas,
    </text>
    <text x="0" y="188" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16" font-weight="400">
      físicas de asfalto y pianos, y línea de IA completa.
    </text>

    <!-- Feature Grid -->
    <g transform="translate(0, 230)">
      <rect x="0" y="0" width="180" height="70" rx="12" fill="#1e293b" stroke="rgba(255,255,255,0.06)" />
      <text x="20" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">COMUNIDAD</text>
      <text x="20" y="56" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17" font-weight="800">Overtake.gg</text>

      <rect x="200" y="0" width="180" height="70" rx="12" fill="#1e293b" stroke="rgba(255,255,255,0.06)" />
      <text x="220" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">HERRAMIENTA</text>
      <text x="220" y="56" fill="#f97316" font-family="system-ui, sans-serif" font-size="17" font-weight="800">Blender + CSP</text>
    </g>
  </g>

  <!-- Right Circuit Diagram Representation -->
  <g transform="translate(680, 150)">
    <rect x="0" y="0" width="380" height="380" rx="20" fill="#0f172a" stroke="rgba(249,115,22,0.2)" stroke-width="1.5" />

    <!-- Circuit outline -->
    <path d="M 80 290 C 40 290 30 180 80 130 C 130 80 220 70 290 90 C 350 110 360 170 330 220 C 300 270 240 230 210 210 C 170 180 130 210 150 250 C 160 280 140 290 80 290 Z"
          fill="none" stroke="#1e293b" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />

    <path d="M 80 290 C 40 290 30 180 80 130 C 130 80 220 70 290 90 C 350 110 360 170 330 220 C 300 270 240 230 210 210 C 170 180 130 210 150 250 C 160 280 140 290 80 290 Z"
          fill="none" stroke="url(#orange-grad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#trackGlow)" />

    <!-- Pit straight line -->
    <line x1="75" y1="270" x2="75" y2="310" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
    <circle cx="75" cy="290" r="5" fill="#22c55e" />

    <!-- Turn markers -->
    <circle cx="310" cy="115" r="5" fill="#facc15" />
    <circle cx="330" cy="220" r="5" fill="#ef4444" />
    <circle cx="210" cy="210" r="5" fill="#38bdf8" />

    <!-- Track Tag -->
    <text x="190" y="345" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">
      TARRAGONA, SPAIN · 3D SCRATCH BUILD
    </text>
  </g>
</svg>
